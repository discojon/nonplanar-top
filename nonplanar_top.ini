; Settings for nonplanar_top.py - keep this file in the same folder as the script.
; Lines starting with ; are comments.  Remove a line to use the built-in default.
; Any setting can also be overridden per print profile in Print Settings > Notes, e.g.
;   nonplanar_top: max_slope_deg=8, finish_direction=y
[nonplanar_top]

; When to convert.
;   notes  = only when Print Settings > Notes contains the word "nonplanar" (recommended)
;   always = every export
activate = notes

; MEASURE THIS: lowest point of the part-cooling fan shroud above the nozzle tip, in mm.
; Measure with the nozzle hot.  1.5 is a cautious default; the correct (usually larger)
; value lets more of the surface be smoothed.  See docs/measuring.md.
shroud_height_mm = 1.5

; Extra clearance kept between the toolhead/shroud and the print (not the nozzle tip).
safety_margin_mm = 0.3

; How far the flat face of the nozzle may iron into the surface right beside it.
plow_tolerance_mm = 0.08

; Steepest surface that gets smoothed (degrees).  Steeper areas keep normal layers.
max_slope_deg = 12

; Smallest area worth smoothing (mm2) and the minimum number of layer steps it must cross.
min_region_area_mm2 = 20
min_levels = 3

; Gap kept from vertical walls and hole edges.  0 = the skin runs right up to the edge.
edge_inset_mm = 0.0

; Skin thickness: finish pass, and the thinnest allowed levelling pass (mm).
finish_layer_mm = 0.2
min_level_layer_mm = 0.1

; Finish pass line direction: auto (along the region's long side) | x | y | angle in degrees
finish_direction = auto

; Skin speeds (mm/s) and acceleration (mm/s2).
level_perimeter_speed = 40
level_infill_speed = 60
finish_perimeter_speed = 35
finish_infill_speed = 50
skin_accel = 1500

; Height of travel moves over the skin (mm).
travel_lift_mm = 0.6

; If the converted file fails a safety check:
;   error = stop the export and show the reason in PrusaSlicer (recommended)
;   skip  = export the file unchanged
on_unsafe = error

; 1 = also save nonplanar_top_last.png (smoothed / excluded areas) next to the log.
; Needs matplotlib (pip install matplotlib).
debug_image = 0
