# PrusaSlicer config bundle: adds one print profile that switches nonplanar_top on.
# Import with  File > Import > Import Config Bundle...
#
# BEFORE IMPORTING: edit the post_process line below so both paths match your PC.
#   - the first path is your python.exe (run  py -0p  in Command Prompt to find it)
#   - the second is where you put nonplanar_top.py
# install_windows.bat prints the exact line for you.
#
# Everything not listed is inherited from the stock Prusa profile named in "inherits".
# If your printer uses a different nozzle/profile, change "inherits" to that profile's name.

[print:0.20mm NONPLANAR @COREONEINDX HF0.4]
inherits = 0.20mm Balanced ★ @COREONEINDX HF0.4
notes = nonplanar
post_process = "C:/Users/YOURNAME/AppData/Local/Programs/Python/Python312/python.exe" "C:/PrusaTools/nonplanar/nonplanar_top.py"
top_fill_pattern = monotoniclines
top_solid_layers = 5
top_solid_min_thickness = 0.7
ironing = 0
complete_objects = 0
spiral_vase = 0
